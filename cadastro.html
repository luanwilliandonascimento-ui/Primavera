<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Primavera</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Clima<span>&</span>Tema
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cidades.html">
                            Cidades
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="climas.html">
                            Climas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="cadastro.html">
                            Cadastro
                        </a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input
                        class="form-control"
                        type="search"
                        placeholder="Pesquisar">

                    <button class="btn btn-primary" type="submit">
                        Pesquisar
                    </button>

                </form>

            </div>

        </div>

    </nav>


    <section class="hero">

        <div class="container">

            <h1>
                Crie sua conta
            </h1>

            <p>
                Cadastre-se para acompanhar lugares e informações
                sobre cidades e climas.
            </p>

        </div>

    </section>


    <section class="cadastro">

        <div class="container">

            <div class="cadastro-box">

                <h2>Cadastro</h2>

                <p class="subtitulo">
                    Preencha seus dados para criar sua conta.
                </p>


                <form>


                    <div class="mb-3">

                        <label for="nome" class="form-label">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nome"
                            placeholder="Digite seu nome"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="cidade" class="form-label">
                            Cidade
                        </label>

                        <select
                            class="form-select"
                            id="cidade"
                            required>

                            <option value="" selected disabled>
                                Selecione sua cidade
                            </option>

                            <option>
                                Americana
                            </option>

                            <option>
                                Santa Bárbara d'Oeste
                            </option>

                            <option>
                                Nova Odessa
                            </option>

                            <option>
                                Sumaré
                            </option>

                            <option>
                                Limeira
                            </option>

                            <option>
                                Campinas
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            placeholder="Digite sua senha"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="confirmarSenha" class="form-label">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmarSenha"
                            placeholder="Digite sua senha novamente"
                            required>

                    </div>


                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="termos"
                            required>

                        <label class="form-check-label" for="termos">
                            Aceito os termos de uso.
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Criar cadastro

                    </button>


                </form>

            </div>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
